<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sản Phẩm - Kaimora Tech</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="icon" href="data:,">
</head>
<body>

  <!-- Header & Navigation -->
  <header class="header">
    <div class="logo">Kaimora Tech</div>
    <nav class="navbar">
      <a href="index.html">Trang chủ</a>
      <a href="products.html" class="active">Sản phẩm</a>
      <a href="cart.html">Giỏ hàng (<span id="cart-count">0</span>)</a>
      <a href="checkout.html">Thanh toán</a>
    </nav>
  </header>

  <main class="container">
    <h1 class="page-title">Danh Sách Sản Phẩm</h1>

    <!-- FORM 2: Form Tìm kiếm & Lọc (Xử lý động qua JS, không reload trang) -->
    <section class="filter-section">
      <form id="filter-form" class="filter-form" onsubmit="event.preventDefault()">
        <div class="filter-group">
          <label for="search-input">Tìm kiếm theo tên:</label>
          <input type="text" id="search-input" placeholder="Nhập tên sản phẩm...">
        </div>

        <div class="filter-group">
          <label for="category-select">Danh mục:</label>
          <select id="category-select">
            <option value="all">Tất cả danh mục</option>
            <option value="phone">Điện thoại</option>
            <option value="accessory">Phụ kiện & Tản nhiệt</option>
            <option value="gear">Gaming Gear</option>
          </select>
        </div>

        <div class="filter-group">
          <label for="max-price">Mức giá tối đa: <span id="price-val">100.000.000đ</span></label>
          <input type="range" id="max-price" min="100000" max="15000000" step="50000" value="15000000">
        </div>
      </form>
    </section>

    <!-- Khu vực render danh sách sản phẩm bằng DOM JS -->
    <section id="product-grid" class="product-grid">
      <!-- Sản phẩm sẽ được render tự động ở đây -->
    </section>
  </main>

  <footer class="footer">
    <p>&copy; 2026 Kaimora Tech - Đồ Án Thiết Kế Web</p>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
